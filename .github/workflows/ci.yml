# CI do Sovereign Harness. Repositório PÚBLICO: só runner hospedado do GitHub.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Guard, instalador e sincronia dos plugins
    # Sandbox real por SO: o bash do macOS é 3.2 e o readlink/stat/GNU não
    # existem lá — portabilidade se prova executando, não inspecionando.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Toolchains reais por SO: os testes multi-stack usam cargo/npm/ruff/
      # pytest de verdade (fail-loud se ausentes — pular esconderia regressão).
      - name: Toolchains (Python + Rust)
        run: |
          python3 -m pip install --quiet ruff pytest
          python3 -m ruff --version && python3 -m pytest --version
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable 2026-10-09
        with:
          components: clippy, rustfmt
      - name: Cópias dos plugins idênticas à fonte
        run: python3 scripts/sincronizar.py --verificar
      - name: Testes (guard em repositórios reais, instalador, integridade)
        run: python3 -m unittest discover -s core/tests -v
      - name: Shell (sintaxe e shellcheck)
        run: |
          for f in install.sh templates/git/pre-push templates/git/pre-commit templates/git/pre-push-portable templates/git/pre-commit-portable templates/git/merge_gate.sh templates/git/test_merge_gate_base.sh templates/git/quadro.sh templates/git/test_quadro.sh; do
            bash -n "$f"
          done
          # Análise estática independe de SO; o binário só existe no ubuntu.
          if command -v shellcheck >/dev/null; then shellcheck -S warning install.sh; fi
      - name: Teste hermético do quadro
        run: bash templates/git/test_quadro.sh templates/git/quadro.sh
      - name: Teste hermético do vínculo merge-base
        run: bash templates/git/test_merge_gate_base.sh templates/git/merge_gate.sh

  tipos-opencode:
    name: Tipos do plugin do OpenCode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22'
      - name: Dependências só de checagem (versões fixas, sem lockfile no repositório)
        run: npm install --no-save --no-package-lock typescript@5.6.3 @types/node@22.10.2 @opencode-ai/plugin@1.18.25
      - name: tsc
        run: npx tsc -p ci/tsconfig.opencode.json
